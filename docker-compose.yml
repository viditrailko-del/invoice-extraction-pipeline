services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
      POSTGRES_DB: invoices
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once on first start: creates the separate test database.
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoices"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    # Dev mode: auto-reload on code changes (polling needed for Windows bind mounts).
    command: uv run --frozen fastapi dev app/main.py --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      # Inside Docker the DB host is the service name "db", not localhost.
      DATABASE_URL: postgresql+psycopg://invoice:invoice@db:5432/invoices
      TEST_DATABASE_URL: postgresql+psycopg://invoice:invoice@db:5432/invoices_test
      UPLOAD_DIR: /app/storage
      WATCHFILES_FORCE_POLLING: "true"
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
