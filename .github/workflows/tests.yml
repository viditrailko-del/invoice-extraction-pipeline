# Runs the test suite exactly as it runs locally: inside the dev container, against
# Postgres from docker-compose. Tests never call Gemini, so no secrets are needed.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build dev image
        run: docker compose build api

      - name: Start Postgres
        run: docker compose up -d --wait db

      - name: Run tests
        run: docker compose run --rm -T api uv run --frozen pytest -q

      - name: Build production image
        run: docker build -t invoice-api .

      - name: Show Postgres logs on failure
        if: failure()
        run: docker compose logs db
