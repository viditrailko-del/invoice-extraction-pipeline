<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label Review</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d232b; --muted: #667085; --line: #e3e6ea;
    --accent: #2457d6; --ok: #13804b; --ok-bg: #e7f6ee; --edit: #a15c00; --edit-bg: #fff4e0;
    --note-bg: #fff9db; --changed: #fff1c2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151a; --panel: #1b2027; --text: #e6e9ee; --muted: #98a2b3; --line: #2b323c;
      --accent: #7aa2ff; --ok: #4fd18b; --ok-bg: #12301f; --edit: #ffb547; --edit-bg: #33260d;
      --note-bg: #2e2a12; --changed: #3a3214;
    }
  }
  * { box-sizing: border-box; }
  /* Fixed-height app layout: photo and form side by side, each scrolls on its own,
     so neither can ever cover the other (works in a small pane too). */
  html, body { height: 100%; }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--text);
         display: flex; flex-direction: column; overflow: hidden; }
  header { flex: none; background: var(--panel); border-bottom: 1px solid var(--line);
           padding: 8px 12px; display: flex; gap: 10px; align-items: center; }
  h1 { font-size: 15px; margin: 0; white-space: nowrap; }
  .chips { display: flex; gap: 6px; overflow-x: auto; min-width: 0; flex: 1; }
  .chip { white-space: nowrap; }
  .chip { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px;
          padding: 3px 10px; cursor: pointer; font: inherit; }
  .chip.active { outline: 2px solid var(--accent); }
  .chip.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
  .chip.edited { background: var(--edit-bg); color: var(--edit); border-color: transparent; }
  .spacer { display: none; }
  .status, header button { white-space: nowrap; }
  button.primary { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 7px 12px;
                   font: inherit; cursor: pointer; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--line);
                     border-radius: 6px; padding: 6px 11px; font: inherit; cursor: pointer; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
         gap: 10px; padding: 10px; }
  @media (max-width: 560px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
  .imgbox { background: #222; border-radius: 8px; overflow: auto; min-height: 0; position: relative; }
  .imgbox img { display: block; width: calc(100% * var(--z, 1)); cursor: zoom-in; }
  .zoombar { position: sticky; top: 6px; left: 6px; z-index: 1; display: inline-flex; gap: 4px; margin: 6px; }
  .zoombar button { background: rgba(0,0,0,.65); color: #fff; border: 0; border-radius: 5px;
                    padding: 3px 9px; font: inherit; cursor: pointer; }
  .form { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px;
          overflow: auto; min-height: 0; }
  .desc { color: var(--muted); margin: 0 0 10px; }
  .note { background: var(--note-bg); border-radius: 6px; padding: 8px 10px; margin: 0 0 12px; }
  .fp { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 6px 8px; align-items: center; }
  label { color: var(--muted); font-size: 13px; }
  input, select, textarea { width: 100%; font: inherit; color: var(--text); background: var(--bg);
                            border: 1px solid var(--line); border-radius: 5px; padding: 5px 7px; }
  input.changed, select.changed { background: var(--changed); border-color: var(--edit); }
  .alt { grid-column: 2; font-size: 12px; color: var(--muted); margin-top: -4px; }
  h2 { font-size: 14px; margin: 18px 0 8px; }
  textarea.grow { resize: none; overflow: hidden; min-height: 0; margin: 0; line-height: 1.35; }
  input.changed, select.changed, textarea.changed { background: var(--changed); border-color: var(--edit); }
  .line { border: 1px solid var(--line); border-radius: 6px; padding: 6px; margin-bottom: 6px; }
  .lnum { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .nums { display: grid; grid-template-columns: auto 1fr auto 1fr auto 1fr; gap: 4px; align-items: center; margin-top: 4px; }
  .nums span { font-size: 11px; color: var(--muted); }
  .nums input { text-align: right; padding: 4px 5px; min-width: 0; }
  .line .alt { margin-top: 3px; }
  .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; align-items: center; }
  .status { font-size: 13px; color: var(--muted); }
  textarea { min-height: 54px; margin-top: 12px; }
  dialog { max-width: 720px; width: 90vw; border: 1px solid var(--line); border-radius: 8px;
           background: var(--panel); color: var(--text); }
  dialog textarea { min-height: 300px; font: 12px ui-monospace, monospace; }
</style>
</head>
<body>
<header>
  <h1>Label review</h1>
  <div class="chips" id="chips"></div>
  <span class="spacer"></span>
  <span class="status" id="progress"></span>
  <button class="secondary" id="export">Export results</button>
</header>
<main>
  <div class="imgbox" id="imgbox">
    <div class="zoombar"><button id="zout" title="Zoom out">−</button><button id="zin" title="Zoom in">+</button></div>
    <img id="img" alt="receipt photo">
  </div>
  <div class="form" id="form"></div>
</main>
<dialog id="dlg">
  <p>Your review results (also saved in this browser). Claude can read them directly; this is a backup copy.</p>
  <textarea id="dlgtext" readonly></textarea>
  <div class="actions"><button class="primary" id="copy">Copy</button><button class="secondary" id="close">Close</button></div>
</dialog>
<script>
const KEY = "label-review-v1";
const HEADER = [
  ["invoice_number", "Invoice number"], ["invoice_date", "Invoice date"], ["due_date", "Due date"],
  ["vendor.name", "Vendor name"], ["vendor.address", "Vendor address"], ["vendor.tax_id", "Vendor tax ID"],
  ["bill_to_name", "Bill to"], ["currency", "Currency"], ["subtotal", "Subtotal"],
  ["discount", "Discount"], ["tax", "Tax (amount)"], ["total", "Total"],
  ["prices_include_tax", "Prices include tax"],
];
const LONG = new Set(["vendor.name", "vendor.address", "invoice_number"]);
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
// Long text gets an auto-growing textarea so nothing is cut off.
const box = (p, value, orig, ph, long) => long
  ? `<textarea rows="1" class="grow" data-path="${p}" data-orig="${esc(show(orig))}" placeholder="${ph}">${esc(value)}</textarea>`
  : `<input data-path="${p}" data-orig="${esc(show(orig))}" value="${esc(value)}" placeholder="${ph}">`;
const grow = el => { el.style.height = "auto"; el.style.height = el.scrollHeight + 2 + "px"; };
let fixtures = [], current = 0, results = {};
try { results = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { results = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(results)); } catch {} };

const get = (obj, path) => path.split(".").reduce((o, k) => o?.[k], obj);
const show = v => v === null || v === undefined ? "" : String(v);
const parse = (raw, original) => {
  if (raw === "") return null;
  if (typeof original === "boolean" || raw === "true" || raw === "false") return raw === "true";
  return raw;
};

function render() {
  const fx = fixtures[current], e = fx.expected, r = results[fx.id] || {};
  document.getElementById("img").src = fx.image;
  const alts = fx.alternatives || {};
  const altLine = p => alts[p] ? `<div class="alt">also accepted: ${alts[p].map(a => a === null ? "null" : `“${a}”`).join(", ")}</div>` : "";
  const val = (p, orig) => p in (r.edits || {}) ? show(r.edits[p]) : show(orig);
  const field = ([p, label]) => {
    const orig = get(e, p);
    if (p === "prices_include_tax") {
      const v = val(p, orig);
      return `<label>${label}</label><select data-path="${p}" data-orig="${show(orig)}">
        ${["true", "false", ""].map(o => `<option value="${o}" ${o === v ? "selected" : ""}>${o || "null (not stated)"}</option>`).join("")}
      </select>${altLine(p)}`;
    }
    return `<label>${label}</label>${box(p, val(p, orig), orig, "null (not printed)", LONG.has(p))}${altLine(p)}`;
  };
  const lines = e.line_items.map((li, i) => {
    const cell = k => {
      const p = `line_items[${i}].${k}`;
      return box(p, val(p, li[k]), li[k], "null", k === "description");
    };
    const alt = ["description", "unit_price"].map(k => alts[`line_items[${i}].${k}`] ? altLine(`line_items[${i}].${k}`) : "").join("");
    return `<div class="line"><div class="lnum">#${i}</div>${cell("description")}
      <div class="nums"><span>qty</span>${cell("quantity")}<span>unit</span>${cell("unit_price")}<span>amount</span>${cell("amount")}</div>${alt}</div>`;
  }).join("");
  const fp = fx.check_false_positives.length
    ? `<p class="fp">Our checks wrongly flag this (correct) document: ${fx.check_false_positives.map(f => f.code + " @ " + f.field_path).join(", ")}</p>` : "";
  document.getElementById("form").innerHTML = `
    <p class="desc"><b>${fx.id}</b> · ${fx.description}</p>
    ${fx.notes ? `<p class="note">${fx.notes}</p>` : ""}${fp}
    <div class="grid">${HEADER.map(field).join("")}</div>
    <h2>Line items (${e.line_items.length})</h2>
    ${lines}
    <textarea id="comment" placeholder="Anything else? (optional comment)">${r.comment || ""}</textarea>
    <div class="actions">
      <button class="primary" id="confirm">Confirm (save edits) &amp; next →</button>
      <button class="secondary" id="reset">Reset my edits</button>
      <span class="status" id="saved">${r.status ? "Saved: " + r.status + (r.status === "edited" ? ` (${Object.keys(r.edits).length} change(s))` : "") : "Not reviewed yet"}</span>
    </div>`;
  document.querySelectorAll("#form [data-path]").forEach(el => {
    const mark = () => { el.classList.toggle("changed", el.value !== el.dataset.orig); if (el.classList.contains("grow")) grow(el); };
    el.addEventListener("input", mark); el.addEventListener("change", mark); mark();
  });
  document.getElementById("confirm").onclick = confirmCurrent;
  document.getElementById("reset").onclick = () => { delete results[fx.id]; save(); render(); };
  renderChips();
}

function confirmCurrent() {
  const fx = fixtures[current], edits = {};
  document.querySelectorAll("#form [data-path]").forEach(el => {
    if (el.value !== el.dataset.orig) edits[el.dataset.path] = parse(el.value, get(fx.expected, el.dataset.path));
  });
  results[fx.id] = { status: Object.keys(edits).length ? "edited" : "ok", edits,
                     comment: document.getElementById("comment").value.trim(),
                     reviewed_at: new Date().toISOString() };
  save();
  if (current < fixtures.length - 1) current++;
  render(); document.getElementById("form").scrollTop = 0; document.getElementById("imgbox").scrollTop = 0;
}

function renderChips() {
  document.getElementById("chips").innerHTML = fixtures.map((fx, i) =>
    `<button class="chip ${results[fx.id]?.status || ""} ${i === current ? "active" : ""}" data-i="${i}">${fx.id}</button>`).join("");
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => { current = +c.dataset.i; render(); });
  const done = fixtures.filter(f => results[f.id]).length;
  document.getElementById("progress").textContent = `${done} / ${fixtures.length} reviewed`;
}

let zoom = 1;
const setZoom = z => { zoom = Math.min(4, Math.max(1, z)); document.getElementById("img").style.setProperty("--z", zoom); };
document.getElementById("zin").onclick = () => setZoom(zoom + 0.5);
document.getElementById("zout").onclick = () => setZoom(zoom - 0.5);
document.getElementById("img").onclick = () => setZoom(zoom >= 2 ? 1 : 2.5);
document.getElementById("export").onclick = () => {
  document.getElementById("dlgtext").value = JSON.stringify(results, null, 2);
  document.getElementById("dlg").showModal();
};
document.getElementById("copy").onclick = () => navigator.clipboard?.writeText(document.getElementById("dlgtext").value);
document.getElementById("close").onclick = () => document.getElementById("dlg").close();

fetch("fixtures.json").then(r => r.json()).then(data => { fixtures = data; render(); });
</script>
</body>
</html>
